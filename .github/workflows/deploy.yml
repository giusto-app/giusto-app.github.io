name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  # NOTE: packages: read is NOT sufficient here and is kept only for clarity.
  # @marcmouries/lilyjs is a private package owned by the USER MarcMouries,
  # while this repository belongs to the ORG giusto-app. GITHUB_TOKEN is scoped
  # to the repo running the workflow and cannot read another owner's private
  # package, and the package's "Manage Actions access" setting only lists
  # repositories under the same owner. A PAT is required — see the install step.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # .npmrc carries only the scope mapping (a project .npmrc shadows ~/.npmrc,
      # so an unset ${NODE_AUTH_TOKEN} there would override a real token with an
      # empty string). Append the credential here instead.
      # LILYJS_PACKAGES_TOKEN is a classic PAT with read:packages, created on the
      # account that owns the package (MarcMouries) and stored as a secret in
      # THIS repository. GITHUB_TOKEN cannot be used: the package belongs to a
      # different owner (see the permissions note above).
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.LILYJS_PACKAGES_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
