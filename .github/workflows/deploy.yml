name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  # @marcmouries/lilyjs is a PRIVATE package on GitHub Packages. Installing it
  # needs this scope plus NODE_AUTH_TOKEN below. Note the package itself must
  # also grant this repository access ("Manage Actions access"), since
  # GITHUB_TOKEN is scoped to the repo running the workflow and lilyJS is a
  # different repository.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # .npmrc carries only the scope mapping (a project .npmrc shadows ~/.npmrc,
      # so an unset ${NODE_AUTH_TOKEN} there would override a real token with an
      # empty string). Append the credential here instead.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
