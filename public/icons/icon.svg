<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#030712"/>
  <!-- Arc track -->
  <path d="M 100 340 A 180 180 0 0 1 412 340" fill="none" stroke="#1f2937" stroke-width="32" stroke-linecap="round"/>
  <!-- Arc (emerald) -->
  <path d="M 100 340 A 180 180 0 0 1 412 340" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round"/>
  <!-- Tick marks -->
  <line x1="100" y1="340" x2="118" y2="322" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="412" y1="340" x2="394" y2="322" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="178" y1="182" x2="190" y2="198" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <line x1="334" y1="182" x2="322" y2="198" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <!-- Needle (pointing straight up = in tune) -->
  <line x1="256" y1="340" x2="256" y2="148" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
  <!-- Pivot -->
  <circle cx="256" cy="340" r="16" fill="#34d399"/>
  <circle cx="256" cy="340" r="8" fill="#030712"/>
</svg>
